name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md', 'llms.txt', 'llms-full.txt']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'llms.txt', 'llms-full.txt']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, never master runs (master pushes arrive every few
  # minutes; cancelling them left no completed master result to read).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.17.0
  # teak depends on zunk by path (../zunk), so every job checks both out as
  # siblings. Bump ZUNK_REF to a branch while a zunk change is unmerged.
  ZUNK_REF: master

# mlugg/setup-zig caches the zig global cache (and wgpu-native prebuilts) per
# job + OS + arch, so every job below gets zig-cache reuse for free.

jobs:
  library:
    name: Library (test, ReleaseSafe, audit, fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: zig fmt --check
        run: git ls-files -z "*.zig" "*.zon" | xargs -0 zig fmt --check
      - name: Library tests (Debug)
        run: zig build test --summary all
      - name: Library tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
      # Depends on test-wasm internally; gates the greppable half of HARDLINE section 5.
      - name: HARDLINE audit
        run: zig build audit
      - name: zunk tests
        working-directory: zunk
        run: zig build test --summary all

  examples:
    name: Example ${{ matrix.example }} (test, build, web)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [chrome, counter_greeter, effects, fonts, gallery, notes, scene3d, todo, tree, viewport]
    defaults:
      run:
        working-directory: teak/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - run: zig build test --summary all
      - name: Build (CLI + native X11 UI exe)
        run: zig build --summary all
      - name: Build web (wasm + zunk dist)
        run: zig build web
      - name: wasm size
        run: ls -l dist/*.wasm

  linux-gpu:
    name: Native GPU on software Vulkan (lavapipe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Install lavapipe
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES=$ICD vulkaninfo --summary | grep -iE "deviceName|driverName" || true
      - name: test-gpu
        run: zig build test-gpu --summary all
      - name: Headless screenshots
        run: |
          mkdir -p ../shots
          for ex in chrome scene3d; do
            (cd examples/$ex && zig build shot -- "$GITHUB_WORKSPACE/shots/$ex.png")
          done
          ls -l ../shots
      - uses: actions/upload-artifact@v4
        with:
          name: native-shots
          path: shots/*.png
          if-no-files-found: error

  x11-host:
    name: X11 host (clipboard, XDND, input method) under Xvfb
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Install Xvfb, xclip, xdotool, libX11
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xclip xdotool libx11-6
      - name: test-x11
        run: xvfb-run -a zig build test-x11 --summary all

  wayland-host:
    name: Wayland host (live tests on weston, real surface on lavapipe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Install weston, Xvfb, xdotool, lavapipe, libwayland / xkbcommon
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston xvfb xdotool xclip \
            libwayland-client0 libwayland-cursor0 libxkbcommon0 libx11-6 \
            mesa-vulkan-drivers libvulkan1
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
      # weston's x11 backend on Xvfb gives a compositor WITH a seat, so
      # xdotool drives real keyboard / pointer / clipboard-focus events
      # (weston's headless backend has no wl_seat).
      - name: Start Xvfb + weston
        working-directory: .
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 weston --backend=x11-backend.so --use-pixman --socket=wl-ci --no-config --width=1000 --height=700 > weston.log 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wl-ci" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: test-wayland
        run: zig build test-wayland --summary all
      - name: Real GPU surface on Wayland (chrome ui stays up for 20 s)
        working-directory: teak/examples/chrome
        env:
          TEAK_BACKEND: wayland
        run: |
          zig build ui-install
          rc=0
          timeout 20 ./zig-out/bin/chrome-ui || rc=$?
          test $rc -eq 124

  web-smoke:
    name: Web smoke (${{ matrix.example }}, headless Chromium + SwiftShader WebGPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [chrome, scene3d]
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teak/tools/package-lock.json
      - name: Build web dist
        working-directory: teak/examples/${{ matrix.example }}
        run: zig build web
      - name: Install puppeteer-core
        working-directory: teak/tools
        run: npm ci --no-audit --no-fund
      - name: Load in Chromium and check the canvas
        working-directory: teak
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/webshot.mjs examples/${{ matrix.example }}/dist web-${{ matrix.example }}.png --wait-ms 5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-${{ matrix.example }}
          path: teak/web-${{ matrix.example }}.png

  # Visual regression (tools/vreg.zig): every example's scripted states vs
  # test/golden/. Goldens are produced on a Mali box; lavapipe differs
  # slightly in AA, which the tolerance in tools/vreg.zig absorbs.
  vreg:
    name: Visual regression (native, lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Install lavapipe
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"
      - name: Compare shots with goldens
        run: zig build vreg
      - name: Raw difference vs goldens (zero tolerance; informational)
        if: always()
        continue-on-error: true
        run: zig build vreg -- --tol 0 --budget 4294967295 --out zig-out/vreg-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vreg-native
          path: |
            teak/zig-out/vreg/*.png
            teak/zig-out/vreg-raw/*.png
          if-no-files-found: ignore

  vreg-web:
    name: Visual regression (web, headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teak/tools/package-lock.json
      - name: Install puppeteer-core
        working-directory: teak/tools
        run: npm ci --no-audit --no-fund
      - name: Compare web builds with goldens
        working-directory: teak
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: zig build vreg -- --web
      - name: Raw difference vs goldens (zero tolerance; informational)
        if: always()
        continue-on-error: true
        working-directory: teak
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: zig build vreg -- --web --tol 0 --budget 4294967295 --out zig-out/vreg-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vreg-web
          path: |
            teak/zig-out/vreg/*.png
            teak/zig-out/vreg-raw/*.png
          if-no-files-found: ignore

  a11y-probe:
    name: A11y probe (todo via the DOM mirror, headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teak/tools/package-lock.json
      - name: Build web dist
        working-directory: teak/examples/todo
        run: zig build web
      - name: Install puppeteer-core
        working-directory: teak/tools
        run: npm ci --no-audit --no-fund
      - name: Read the browser accessibility tree and drive the app through it
        working-directory: teak
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/a11yprobe.mjs todo examples/todo/dist

  windows:
    name: Windows ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64, cross: "aarch64-windows-gnu" }
          - { os: windows-11-arm, arch: aarch64, cross: "x86_64-windows-gnu" }
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Toolchain is native
        run: |
          zig version
          $env:PROCESSOR_ARCHITECTURE
          zig env | Select-String "target"
      # The first build on a restored zig cache has twice lost
      # compiler_rt.lib on windows-11-arm (lld-link "could not open ...
      # compiler_rt.lib"), a cache-race artifact that a second run clears.
      - name: Library tests (Debug)
        run: |
          zig build test --summary all
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::retrying once with a clean zig cache (stale compiler_rt?)"
            Remove-Item -Recurse -Force "$env:ZIG_GLOBAL_CACHE_DIR\o" -ErrorAction SilentlyContinue
            zig build test --summary all
          }
          if ($LASTEXITCODE -ne 0) { throw "library tests failed" }
      - name: Library tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: Examples (test + build incl. Win32 UI exe)
        run: |
          foreach ($d in Get-ChildItem examples -Directory) {
            Write-Host "::group::$($d.Name)"
            Push-Location $d.FullName
            zig build test --summary all
            if ($LASTEXITCODE -ne 0) { throw "$($d.Name): test failed" }
            zig build --summary all
            if ($LASTEXITCODE -ne 0) { throw "$($d.Name): build failed" }
            Pop-Location
            Write-Host "::endgroup::"
          }
      - name: Run an optimized example natively (chrome, ReleaseFast)
        working-directory: teak/examples/chrome
        run: |
          zig build run -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast --summary all
      - name: Cross-target sanity (chrome)
        working-directory: teak/examples/chrome
        run: |
          zig build -Dtarget=${{ matrix.cross }} --summary all
          zig build -Dtarget=x86_64-linux-gnu --summary all
      # Headless wgpu on the runner's software adapter (DX12 WARP): proves
      # the Windows wgpu-native + stb text path renders real pixels. The
      # PNGs are uploaded for a human to look at. `zig build shot` runs the
      # exe from the zig cache, where Windows cannot find wgpu_native.dll;
      # the build installs the DLL to zig-out\bin, so put that on PATH.
      - name: Headless screenshots (WARP software adapter)
        env:
          TEAK_GPU_FALLBACK: "1"
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\shots" | Out-Null
          foreach ($ex in "chrome", "scene3d") {
            Push-Location "examples/$ex"
            $env:PATH = "$PWD\zig-out\bin;$env:PATH"
            zig build shot -- "$env:GITHUB_WORKSPACE\shots\win-$ex-${{ matrix.arch }}.png"
            if ($LASTEXITCODE -ne 0) { throw "${ex}: headless shot failed" }
            Pop-Location
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots-${{ matrix.arch }}
          path: shots/*.png
          if-no-files-found: warn

  macos:
    name: macOS (library + web; no native backend yet)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: actions/checkout@v4
        with: { repository: hotschmoe/zunk, ref: "${{ env.ZUNK_REF }}", path: zunk }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Library tests
        run: zig build test --summary all
      - name: Example tests + web (chrome)
        working-directory: teak/examples/chrome
        run: |
          zig build test --summary all
          zig build web
