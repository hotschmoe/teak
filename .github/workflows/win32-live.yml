name: Win32 background gate

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

jobs:
  heavy:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64 }
          - { os: windows-11-arm, arch: aarch64 }
    defaults:
      run:
        working-directory: teak
    steps:
      - uses: actions/checkout@v4
        with: { path: teak }
      - uses: mlugg/setup-zig@v2
        with: { version: '0.17.1' }
      - name: Run background gate
        env:
          TEAK_HEAVY_OUT: ${{ github.workspace }}\live-${{ matrix.arch }}
        run: zig build test-heavy -j4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.arch }}
          path: ${{ github.workspace }}/live-${{ matrix.arch }}/**
          if-no-files-found: warn
